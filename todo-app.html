<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Tasks | To-Do App</title>
  <link rel="stylesheet" href="styles/todo-app.css">
  <script src="todo-app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="page-shell">
      <p class="eyebrow">Productivity Assignment</p>
      <h1>Focus Tasks</h1>
      <p class="intro">Add tasks, tag them by context, filter your list, and keep everything saved between visits.</p>
    </div>
  </header>

  <main class="page-shell">
    <section class="app-card" aria-labelledby="form-heading">
      <div class="section-heading">
        <h2 id="form-heading">Add a Task</h2>
        <p id="task-counter">0 active tasks</p>
      </div>

      <form id="task-form" class="task-form" novalidate>
        <div class="form-field">
          <label for="task-name">Task name</label>
          <input id="task-name" name="task-name" type="text" placeholder="Finish Module 7 assignment">
        </div>

        <div class="form-field">
          <label for="task-tag">Tag</label>
          <select id="task-tag" name="task-tag">
            <option value="">No tag</option>
            <option value="school">School</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
          </select>
        </div>

        <button class="primary-button" type="submit">Add Task</button>
      </form>

      <p id="form-error" class="error-message" aria-live="polite"></p>
    </section>

    <section class="app-card" aria-labelledby="filters-heading">
      <div class="section-heading">
        <h2 id="filters-heading">Tasks</h2>
        <p id="filter-status">Showing all tasks</p>
      </div>

      <div class="filters" aria-label="Task filters">
        <div class="filter-group" role="group" aria-label="Completion filters">
          <button class="filter-button active-filter" type="button" data-filter="all">All</button>
          <button class="filter-button" type="button" data-filter="active">Active</button>
          <button class="filter-button" type="button" data-filter="completed">Completed</button>
        </div>

        <div class="tag-filter">
          <label for="tag-filter">Filter by tag</label>
          <select id="tag-filter">
            <option value="all">All tags</option>
            <option value="school">School</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="none">No tag</option>
          </select>
        </div>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
    </section>
  </main>
</body>
</html>
